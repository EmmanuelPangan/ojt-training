<section class="register-shell">
  <div class="welcome-panel">
    <p class="eyebrow">Join Us</p>
    <h1>Create your account</h1>
    <p class="welcome-copy">
      Start managing bookings, places, and project tasks with a fresh workspace built for your training flow.
    </p>
    <div class="welcome-badges">
      <span>Organized</span>
      <span>Reliable</span>
      <span>Ready</span>
    </div>
  </div>

  <div class="register-container">
    <h2>Sign Up</h2>
    <p class="subtitle">Fill in your details to create a new account.</p>

    <form [formGroup]="loginForm" (ngSubmit)="submit()">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" formControlName="email" placeholder="Enter your email">
      </div>

      <div class="field">
        <label for="username">Username</label>
        <input id="username" type="text" formControlName="username" placeholder="Choose a username">
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" formControlName="password" placeholder="Create a password">
      </div>

      <div class="field">
        <label for="confirm-password">Confirm Password</label>
        <input id="confirm-password" type="password" formControlName="c-password" placeholder="Re-enter your password">
      </div>

      <button type="submit">Register</button>

      <p *ngIf="error" class="error-message">{{ error }}</p>
    </form>
    <p class="login-link">Have an account? <a [routerLink]="['/login']">Login</a></p>
  </div>
</section>
