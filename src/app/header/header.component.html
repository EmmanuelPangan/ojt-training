<mat-toolbar color="primary" class="head">
  <button mat-icon-button class="menu-btn" (click)="toggleSidebar()" aria-label="Toggle sidebar">
    <mat-icon>menu</mat-icon>
  </button>

  <span class="title">{{ title }}</span>

  <nav class="nav-links" aria-label="Header navigation">
    <button mat-icon-button routerLink="/home" aria-label="Home">
      <mat-icon>home</mat-icon>
    </button>

    <a *ngIf="!authService.isLogin()" mat-button routerLink="/login" routerLinkActive="active">
      Login
    </a>

    <button *ngIf="authService.isLogin()" mat-button (click)="logout()">
      Logout
    </button>
  </nav>
</mat-toolbar>
