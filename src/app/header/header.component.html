<h1>Interpolation</h1>
{{Welcome}}
<p></p>

<h1>Property Binding</h1>
<button [disabled]="isButtonDisabled"> Disabled Button</button>

<h1>Event Binding</h1>
<button (click)="onClick()">Click It</button>
<p>{{message}}</p>

<h1>ngIf</h1>

<button (click)="toggleAuth()">
    {{isLoggedIn ? 'Log Out': 'Log In'}}
</button>
<div *ngIf="isLoggedIn; else loggedOut">
    Hello, Welcome {{user.name}}
</div>

<div *ngIf="!isLoggedIn">
    Please Log In
</div>

<h1>ngFor</h1>
<div>
    <table border="1">
        <thead>
            <tr>
                <th>Product Name</th>
                <th>Price</th>
                <th>Availability</th>
            </tr>
        </thead>

        <tbody>
            <tr *ngFor="let product of products">
                <td>{{product.productname}}</td>
                <td>{{product.Price}}</td>
                <td>{{product.Availability}}</td>
            </tr>
        </tbody>
    </table>
    
</div>
<h1></h1>
