<div class="app-container">
  <app-head (logoClick)="toggleSidebar()"></app-head>

  <div class="main-layout">
    <app-left-sidebar
      [isOpen]="isSidebarOpen"
      class="sidebar">
    </app-left-sidebar>

    <div class="right-panel">
      <app-header
        class="animate"
        [class.shifted]="isSidebarOpen">
      </app-header>

      <div class="content">
        <router-outlet></router-outlet>
      </div>
    </div>
  </div>

  <app-foot></app-foot>
</div>
