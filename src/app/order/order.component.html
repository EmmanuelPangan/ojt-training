<div class="order-management-container">
  <h2>Order Management</h2>

  <!-- Tabs -->
  <div class="tabs">
    <button [class.active]="activeTab === 'add'" (click)="switchTab('add')">Add</button>
    <button [class.active]="activeTab === 'edit'" (click)="switchTab('edit')">Edit</button>
    <button [class.active]="activeTab === 'delete'" (click)="switchTab('delete')">Delete</button>
    <button [class.active]="activeTab === 'completed'" (click)="switchTab('completed')">Completed Task</button>
  </div>

  <div class="form-group order-search">
    <label for="orderSearch">Search by Order Name</label>
    <input
      id="orderSearch"
      type="text"
      [(ngModel)]="orderSearchTerm"
      placeholder="Type order name..."
    />
  </div>
  <hr>
<!-- Current Orders List -->
<h3 *ngIf="activeTab !== 'completed'">Current Orders</h3>

<table class="orders-table" *ngIf="activeTab !== 'completed'">
  <thead>
    <tr>
      <th class="check-col" *ngIf="activeTab === 'add'"></th>
      <th class="id-col">ID</th>
      <th class="name-col">Order Name</th>
      <th class="qty-col">Quantity</th>
      <th class="price-col">Price</th>
      <th class="actions-col">Actions</th>
    </tr>
  </thead>

  <tbody>
    <tr *ngFor="let o of filteredOrders"
        (click)="activeTab === 'edit' ? selectOrderForEdit(o) : null"
        [class.selected]="(activeTab === 'delete' ? deleteForm.value.id : editForm.value.id) === o.id">
      <td class="check-col" *ngIf="activeTab === 'add'">
        <input type="checkbox" [checked]="isCompleted(o.id)" (change)="onDeliveredToggle(o.id, $event)" />
      </td>
      <td class="id-col">
        {{ o.id }}
      </td>
      <td class="name-col"><strong>{{ o.orderName }}</strong></td>
      <td class="qty-col">{{ o.quantity }}</td>
      <td class="price-col">{{ o.price | currency : 'USD'}}</td>
      
      <td class="actions-col">
        <button
          class="btn btn-sm btn-danger"
          (click)="selectOrderForDelete(o.id); onDelete(); $event.stopPropagation();"
          *ngIf="activeTab === 'delete'">
          Delete
        </button>
        <button
          class="btn btn-sm btn-primary"
          (click)="markCompleted(o.id); $event.stopPropagation();"
          [disabled]="isCompleted(o.id)"
          *ngIf="activeTab !== 'delete'">
          {{ isCompleted(o.id) ? 'Completed' : 'Mark Delivered' }}
        </button>
      </td>
    </tr>
  </tbody>
</table>


  <div *ngIf="activeTab === 'add'" class="tab-content">
    <form [formGroup]="addForm" (ngSubmit)="onAdd()" class="task-form">
      <div class="form-group">
        <label for="addOrderName">Order Name</label>
        <input type="text" id="addOrderName" formControlName="orderName" placeholder="Enter order name">
      </div>

      <div class="form-group">
        <label for="addQuantity">Quantity</label>
        <input type="number" id="addQuantity" formControlName="quantity" placeholder="Enter quantity">
      </div>

      <div class="form-group">
        <label for="addPrice">Price</label>
        <input type="number" id="addPrice" formControlName="price" placeholder="Enter price">
      </div>

      <button type="submit" [disabled]="addForm.invalid" class="btn btn-primary">
        Add Order
      </button>
    </form>
  </div>

  <div *ngIf="activeTab === 'edit'" class="tab-content">
    <form [formGroup]="editForm" (ngSubmit)="onEdit()" class="task-form">
      <div class="form-group">
        <label for="editOrderName">Order Name</label>
        <input type="text" id="editOrderName" formControlName="orderName" placeholder="Enter new order name">
      </div>

      <div class="form-group">
        <label for="editQuantity">Quantity</label>
        <input type="number" id="editQuantity" formControlName="quantity" placeholder="Enter new quantity">
      </div>

      <div class="form-group">
        <label for="editPrice">Price</label>
        <input type="number" id="editPrice" formControlName="price" placeholder="Enter new price">
      </div>

      <button type="submit" [disabled]="editForm.invalid || !isEditValid()" class="btn btn-warning">
        Update Order
      </button>
    </form>
  </div>
  
  <div *ngIf="activeTab === 'delete'" class="tab-content">
    <form [formGroup]="deleteForm" (ngSubmit)="onDelete()" class="task-form">
      <div class="form-group">
      </div>
    </form>
  </div>

  <div *ngIf="activeTab === 'completed'" class="tab-content">
    <app-completed-task
      [completedOrders]="completedOrders"
      [searchTerm]="orderSearchTerm"
      (markActive)="markIncomplete($event)">
    </app-completed-task>
  </div>

  <hr>

  
</div>
