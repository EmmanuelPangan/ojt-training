<h3>Completed Order</h3>
<p *ngIf="completedOrders.length === 0">No completed tasks yet.</p>
<p *ngIf="completedOrders.length > 0 && filteredCompletedOrders.length === 0">No matching completed orders.</p>

<table class="orders-table" *ngIf="filteredCompletedOrders.length > 0">
  <thead>
    <tr>
      <th>ID</th>
      <th>Order Name</th>
      <th>Quantity</th>
      <th>Price</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let o of filteredCompletedOrders">
      <td>{{ o.id }}</td>
      <td><strong>{{ o.orderName }}</strong></td>
      <td>{{ o.quantity }}</td>
      <td>{{ o.price | currency : 'USD' }}</td>
    </tr>
  </tbody>
</table>
