<div class="task-container">
  <h3>Delete Order</h3>

  <form [formGroup]="deleteForm" (ngSubmit)="onSubmit()" class="task-form">
    <div class="form-group">
      <label for="id">Select Order to Delete</label>
      <select id="id" formControlName="id">
        <option value="" disabled>Select an order</option>
        <option *ngFor="let o of orders" [value]="o.id">
          {{ o.orderName }} (Qty: {{ o.quantity }}, Price: {{ o.price }})
        </option>
      </select>
    </div>

    <button type="submit" [disabled]="deleteForm.invalid" class="btn btn-danger">
      Delete Order
    </button>
  </form>
</div>
