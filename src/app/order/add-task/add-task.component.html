<div class="add-task-container">
  <h3>Add Order</h3>

  <form [formGroup]="addForm" (ngSubmit)="onSubmit()" class="add-task-form">
    <div class="form-group">
      <label for="orderName">Order Name</label>
      <input type="text" id="orderName" formControlName="orderName" placeholder="Enter order name">
      <small
        class="error-message"
        *ngIf="addForm.get('orderName')?.touched && addForm.get('orderName')?.hasError('hasNumber')"
      >
        Order Name must not contain numbers.
      </small>
    </div>

    <div class="form-group">
      <label for="quantity">Quantity</label>
      <input type="number" id="quantity" formControlName="quantity" placeholder="Enter quantity">
    </div>

    <div class="form-group">
      <label for="price">Price</label>
      <input type="number" id="price" formControlName="price" placeholder="Enter price">
    </div>

    <button type="submit" [disabled]="addForm.invalid" class="btn btn-primary">
      Add Order
    </button>
  </form>
</div>
